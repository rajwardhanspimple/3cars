name: Mustang asset audit
on:
  push:
    paths:
      - scripts/audit-mustang.mjs
      - .github/workflows/asset-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-mustang.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mustang-asset-audit
          path: asset-audit/
          retention-days: 7
