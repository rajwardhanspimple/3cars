name: Mustang frame timing
on:
  push:
    paths:
      - test/browser/frame-timing.spec.js
      - test/browser/worker-diagnostic.spec.js
      - .github/workflows/model-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium > /tmp/chromium.log 2>&1 || (tail -30 /tmp/chromium.log; exit 1)
      - run: npx playwright test test/browser/worker-diagnostic.spec.js --reporter=list,./test/browser/live-reporter.js
